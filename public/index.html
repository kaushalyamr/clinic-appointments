<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6f68" />
    <title>Cedar Clinic — Appointments</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230b6f68'/%3E%3Cstop offset='1' stop-color='%2316b3a3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Cedar Clinic home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-text">
          <strong>Cedar Clinic</strong>
          <small>Appointments</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button id="bell" class="icon-button" type="button" aria-label="Notifications" data-action="bell" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a5 5 0 0 0-5 5v3.6L5.2 15h13.6L17 11.6V8a5 5 0 0 0-5-5Zm0 18a3 3 0 0 0 2.8-2H9.2A3 3 0 0 0 12 21Z" fill="currentColor" /></svg>
          <span id="bell-count" class="badge" hidden>0</span>
        </button>
        <span id="who" class="who" hidden></span>
        <button id="signout" class="ghost-button" type="button" data-action="logout" hidden>Sign out</button>
      </div>
    </header>

    <nav id="tabs" class="tabs" hidden></nav>

    <main id="app" class="app" aria-live="polite">
      <p class="loading">Loading Cedar Clinic…</p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
